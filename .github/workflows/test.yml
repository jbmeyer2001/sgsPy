on:
  push:
    branches:
      - failing_linux_ghactions_build
permissions:
  contents:
    write

jobs: 
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.14" ]
        
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
        
      - name: Install and build C++ dependencies
        run: bash scripts/install.sh
        
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest geopandas
        
      - name: Build package
        run: |
          ls /home/runner/work/sgsPy/sgsPy/sgspy/extern/vcpkg/installed/x64-linux/lib/pkgconfig
          find . -name "gdal.pc"
          bash scripts/build.sh
        
      - name: Run pytests
        run: pytest
